<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大肥鱼 · 海景小屋</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="scene"></div>

  <!-- 左上：时间与状态 -->
  <div class="hud hud-tl">
    <div class="clock" id="clock">09:00</div>
    <div class="where"><span id="loc">窗边</span><i></i><span id="act">发呆</span></div>
  </div>

  <!-- 左下：三条核心数值 -->
  <div class="hud hud-bars">
    <div class="bar-row">
      <span class="bar-label">心情</span>
      <div class="bar"><i id="bar-mood"></i></div>
      <span class="bar-val" id="val-mood">60</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">饱腹</span>
      <div class="bar"><i id="bar-full" class="full"></i></div>
      <span class="bar-val" id="val-full">68</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">精力</span>
      <div class="bar"><i id="bar-energy" class="energy"></i></div>
      <span class="bar-val" id="val-energy">72</span>
    </div>
    <div class="solitude">独处 <span id="val-alone">0</span> 分钟</div>
  </div>

  <!-- 气泡 -->
  <div id="bubble" class="bubble"></div>

  <!-- 日记 -->
  <aside id="diary" class="diary">
    <div class="diary-head">
      <span>📓 小鱼日记</span>
      <button id="diary-close">✕</button>
    </div>
    <div class="diary-time" id="diary-time"></div>
    <div class="diary-body">
      <div class="diary-line"><b>心情</b><span id="diary-mood"></span></div>
      <div class="diary-line"><b>状态</b><span id="diary-state"></span></div>
      <p id="diary-text"></p>
    </div>
  </aside>

  <!-- 底部操作 -->
  <div class="dock">
    <button id="feed" class="btn primary">🍚 投喂白饭</button>
    <button id="talk" class="btn">💬 叫她一声</button>
    <button id="diary-btn" class="btn">📓 日记本</button>
  </div>

  <!-- 启动遮罩 -->
  <div id="boot" class="boot">
    <div class="boot-fish">🐋</div>
    <div class="boot-txt">正在推开小屋的门…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
